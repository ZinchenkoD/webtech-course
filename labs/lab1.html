<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

    <style type="text/css">

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Montserrat", sans-serif;
        }

        main section, header{
            width: 1280px;
            margin: 0 auto;
            padding: 20px 0;
            background-color: white;
        }

        nav{
            width: 1280px;
            display: flex;
            justify-content: space-between;
        }

        nav a{
            text-decoration: none;
            color: black;
            font-weight: 500;
            font-size: 20px;
        }

        nav a:hover{
            text-decoration: underline;
        }

        h1, form{
            margin: 50px;
        }

    </style>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about-me">Про мене</a>
            <a href="index.html#hands-on">Практичні роботи</a>
            <a href="index.html#labs">Лабораторні роботи</a>
        </nav>
    </header>

    <h1>Форма реєстрації користувача</h2>

    <form action="https://webhook.site/6d638aea-2c7e-4918-8373-ab474e964f91" method="POST">
        
        <div>
            <label for="first_name">Ім'я:</label><br>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        <br>

        <div>
            <label for="last_name">Прізвище:</label><br>
            <input type="text" id="last_name" name="last_name" required>
        </div>
        <br>

        <div>
            <label for="email">Електронна пошта:</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <div>
            <label for="password">Пароль:</label><br>
            <input type="password" id="password" name="password" required>
        </div>
        <br>

        <div>
            <label for="confirm_password">Підтвердження паролю:</label><br>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <br>

        <div>
            <label for="birthdate">Дата народження:</label><br>
            <input type="date" id="birthdate" name="birthdate">
        </div>
        <br>

        <div>
            <label for="gender">Стать:</label><br>
            <select id="gender" name="gender">
                <option value="">-- Оберіть стать --</option>
                <option value="male">Чоловіча</option>
                <option value="female">Жіноча</option>
                <option value="other">Інша</option>
            </select>
        </div>
        <br>

        <div>
            <input type="submit" value="Зареєструватися">
        </div>

    </form>

</body>
